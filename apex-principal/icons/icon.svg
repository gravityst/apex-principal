<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#16243a"/>
      <stop offset="0.5" stop-color="#0a1120"/>
      <stop offset="1" stop-color="#03060c"/>
    </linearGradient>
    <linearGradient id="amber" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#ffc766"/>
      <stop offset="0.38" stop-color="#ff9412"/>
      <stop offset="1" stop-color="#d94f00"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.66" r="0.52">
      <stop offset="0" stop-color="#ff8a00" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#ff8a00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.16" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.84" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1"    stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="tight" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <circle cx="512" cy="640" r="440" fill="url(#glow)"/>

  <!-- Kerb at the exit. -->
  <g opacity="0.62">
    <rect x="96" y="820" width="832" height="46" rx="6" fill="#161f2f"/>
    <g fill="#d9372f">
      <rect x="96"  y="820" width="94" height="46" rx="6"/>
      <rect x="284" y="820" width="94" height="46"/>
      <rect x="472" y="820" width="94" height="46"/>
      <rect x="660" y="820" width="94" height="46"/>
      <rect x="848" y="820" width="80" height="46" rx="6"/>
    </g>
  </g>

  <!-- The apex. -->
  <path d="M512 132 L884 820 L726 820 L512 424 L298 820 L140 820 Z" fill="url(#amber)"/>
  <path d="M512 132 L884 820 L726 820 L512 424 L298 820 L140 820 Z"
        fill="none" stroke="#ffe0b0" stroke-width="6" stroke-linejoin="round" opacity="0.38"/>

  <!-- The racing line: in wide, late apex, out wide. Drawn over the mark,
       because the line is the point — the apex is where it touches. -->
  <g>
    <path d="M78 792 C 300 760, 392 430, 556 306 C 700 452, 762 742, 946 792"
          fill="none" stroke="url(#fade)" stroke-width="34" stroke-linecap="round"
          opacity="0.5" filter="url(#soft)"/>
    <path d="M78 792 C 300 760, 392 430, 556 306 C 700 452, 762 742, 946 792"
          fill="none" stroke="url(#fade)" stroke-width="15" stroke-linecap="round"/>
    <path d="M78 792 C 300 760, 392 430, 556 306 C 700 452, 762 742, 946 792"
          fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"
          opacity="0.55" filter="url(#tight)"/>
  </g>
</svg>
